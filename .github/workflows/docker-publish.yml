name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: docker_creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub credentials (DOCKER_USERNAME/DOCKER_PASSWORD) not found in GitHub Secrets. Images will be built but not pushed."
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      # 1. 构建并发布 Alpine Musl 全静态编译引擎 (支持 Intel x86_64 与 Apple Silicon / ARM64)
      - name: Build & Push Alpine Static Builder
        uses: docker/build-push-action@v5
        with:
          context: ./alpine
          file: ./alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.docker_creds.outputs.has_creds == 'true' }}
          tags: |
            tinywan/typephp-builder:alpine
            tinywan/typephp-builder:static
            tinywan/typephp-builder:latest
            tinywan/typephp-builder:${{ github.ref_name }}
            tinywan/typephp-builder:${{ github.ref_name }}-alpine
            tinywan/typephp-builder:${{ github.ref_name }}-static
            tinywan/typephp-webman-builder:alpine
            tinywan/typephp-webman-builder-static:${{ github.ref_name }}

      # 2. 构建并发布 Glibc 动态便携包编译引擎 (支持 Intel x86_64 与 Apple Silicon / ARM64)
      - name: Build & Push Glibc Builder
        uses: docker/build-push-action@v5
        with:
          context: ./glibc
          file: ./glibc/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.docker_creds.outputs.has_creds == 'true' }}
          tags: |
            tinywan/typephp-builder:glibc
            tinywan/typephp-builder:${{ github.ref_name }}-glibc
            tinywan/typephp-webman-builder:${{ github.ref_name }}
