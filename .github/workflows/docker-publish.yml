name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: docker_creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub credentials (DOCKER_USERNAME/DOCKER_PASSWORD) not found in GitHub Secrets. Images will be built but not pushed."
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Image Version
        id: version
        run: |
          ref="${{ github.ref_name }}"
          clean_version="${ref#v}"
          echo "version=${clean_version}" >> "$GITHUB_OUTPUT"

      # 1. 构建并发布 Alpine Musl 全静态编译引擎 (支持 Intel x86_64 与 Apple Silicon / ARM64)
      - name: Build & Push Alpine Static Builder
        uses: docker/build-push-action@v5
        with:
          context: ./alpine
          file: ./alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.docker_creds.outputs.has_creds == 'true' }}
          tags: |
            tinywan/typephp-builder:alpine
            tinywan/typephp-builder:static
            tinywan/typephp-builder:latest
            tinywan/typephp-builder:${{ steps.version.outputs.version }}
            tinywan/typephp-builder:${{ steps.version.outputs.version }}-alpine
            tinywan/typephp-builder:${{ steps.version.outputs.version }}-static
            tinywan/typephp-builder:${{ github.ref_name }}
            tinywan/typephp-builder:${{ github.ref_name }}-alpine
            tinywan/typephp-webman-builder:alpine
            tinywan/typephp-webman-builder-static:${{ steps.version.outputs.version }}
            tinywan/typephp-webman-builder-static:${{ github.ref_name }}

      # 2. 构建并发布 Glibc 动态便携包编译引擎 (支持 Intel x86_64 与 Apple Silicon / ARM64)
      - name: Build & Push Glibc Builder
        uses: docker/build-push-action@v5
        with:
          context: ./glibc
          file: ./glibc/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.docker_creds.outputs.has_creds == 'true' }}
          tags: |
            tinywan/typephp-builder:glibc
            tinywan/typephp-builder:${{ steps.version.outputs.version }}-glibc
            tinywan/typephp-builder:${{ github.ref_name }}-glibc
            tinywan/typephp-webman-builder:${{ steps.version.outputs.version }}
            tinywan/typephp-webman-builder:${{ github.ref_name }}

      # 3. 打包各平台独立运行脚本并上传至 GitHub Release Assets
      - name: Package & Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist-assets/windows dist-assets/macos dist-assets/linux

          cp bin/typephp-builder.cmd bin/build.cmd docker-compose.yml README.md dist-assets/windows/
          cp bin/typephp-builder bin/build.command docker-compose.yml README.md dist-assets/macos/
          cp bin/typephp-builder docker-compose.yml README.md dist-assets/linux/
          chmod +x dist-assets/macos/* dist-assets/linux/*

          (cd dist-assets/windows && zip -r "../typephp-builder_${VERSION}_windows-x86_64_php-8.5.0.zip" .)
          tar -czf "dist-assets/typephp-builder_${VERSION}_macos-arm64_php-8.5.0.tar.gz" -C dist-assets/macos .
          tar -czf "dist-assets/typephp-builder_${VERSION}_linux-x86_64_php-8.5.0.tar.gz" -C dist-assets/linux .

          gh release upload "${{ github.ref_name }}" \
            "dist-assets/typephp-builder_${VERSION}_windows-x86_64_php-8.5.0.zip" \
            "dist-assets/typephp-builder_${VERSION}_macos-arm64_php-8.5.0.tar.gz" \
            "dist-assets/typephp-builder_${VERSION}_linux-x86_64_php-8.5.0.tar.gz" \
            --clobber || true
